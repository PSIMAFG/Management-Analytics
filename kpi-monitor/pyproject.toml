[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kpi-monitor"
version = "1.0.0"
description = "Monitor de indicadores de gestión multisede: cumplimiento contra metas, semáforo, índice ponderado, proyección al cierre y reporte ejecutivo."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.8,<7",
    "matplotlib>=3.9,<4",
    "openpyxl>=3.1,<4",
    "numpy>=1.26,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.6,<1",
]
build = [
    "pyinstaller>=6.10,<7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kpi_monitor = ["data/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["build", "dist", ".venv"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "ANN", "RUF", "T20", "PTH", "C4", "RET", "PIE", "ARG"]
ignore = ["ANN401"]
allowed-confusables = ["×", "–"]

[tool.ruff.lint.per-file-ignores]
"src/kpi_monitor/ui/*" = ["N802"]
